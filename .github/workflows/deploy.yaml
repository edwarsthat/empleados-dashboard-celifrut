# Repositorio público: los jobs de CI (build) nunca acceden a secretos.
# Los secretos solo están disponibles en el job deploy, que corre
# exclusivamente en push a main (nunca en pull_request desde forks).

name: Frontend CI/CD

# Permisos mínimos por defecto — cada job eleva solo lo que necesita.
permissions: read-all

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Job 1: CI — build y verificación ──────────────────────────────────────
  # Corre en push Y en pull_request. Sin secretos. Seguro para forks externos.
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.2.2

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Sube dist/ como artefacto — el job deploy lo descarga.
      # Garantiza que el servidor recibe exactamente el mismo build que pasó CI.
      - name: Subir artefacto dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── Job 2: CD — deploy al VPS ─────────────────────────────────────────────
  # SOLO corre en push a main (PR mergeado). NUNCA en pull_request.
  # Un PR de fork dispara pull_request, no push → nunca llega a este job.
  deploy:
    runs-on: ubuntu-22.04
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    environment: production

    steps:
      - name: Descargar artefacto dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Configurar SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Desplegar dist al servidor
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes" \
            ./dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}
